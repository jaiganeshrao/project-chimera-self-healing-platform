services:
  chimera-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-chimera
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      APP_URL: ${APP_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - chimera-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  chimera-data:
