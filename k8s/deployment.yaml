apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-chimera
  labels:
    app: project-chimera
spec:
  # Must remain 1 replica with Recreate strategy because server/storage.ts
  # persists to a local JSON file (/app/data/chimera_db.json) and
  # monitoring/testbed state runs in-process.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: project-chimera
  template:
    metadata:
      labels:
        app: project-chimera
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: chimera-platform
          image: project-chimera:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: chimera-config
          # Optional: uncomment if providing GEMINI_API_KEY via a Kubernetes Secret
          # env:
          #   - name: GEMINI_API_KEY
          #     valueFrom:
          #       secretKeyRef:
          #         name: chimera-secrets
          #         key: GEMINI_API_KEY
          #         optional: true
          volumeMounts:
            - name: chimera-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: chimera-data
          persistentVolumeClaim:
            claimName: chimera-data-pvc
