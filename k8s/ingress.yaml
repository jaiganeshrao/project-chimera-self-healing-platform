apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: project-chimera-ingress
  labels:
    app: project-chimera
spec:
  rules:
    - host: chimera.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: project-chimera-service
                port:
                  number: 80
