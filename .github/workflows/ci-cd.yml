
name: Project Chimera CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            jai29454654/project-chimera:latest
            jai29454654/project-chimera:${{ github.sha }}

  deploy-to-kubernetes:
    runs-on: [self-hosted, Windows, X64]
    needs: build-and-push

    steps:
      - name: Verify Kubernetes connection
        run: kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/project-chimera chimera-platform=jai29454654/project-chimera:${{ github.sha }}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/project-chimera --timeout=180s
          kubectl get pods
          kubectl get services
